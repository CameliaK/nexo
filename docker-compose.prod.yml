# Production override — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Every variable is documented in .env.prod.example. The required ones use
# ${VAR:?…}: `docker compose … config` fails if any is missing, instead of
# silently falling back to the dev defaults of docker-compose.yml (a known
# n8n password, the "nexo" Postgres password, an ephemeral PASETO key).
#
# Memory limits are calculated for an 8 GB VPS (Hetzner CX32):
#   OS + Docker overhead ≈ 1.5 GB; total limits ≈ 3.6 GB → ~2.9 GB headroom.
#   Measurements from docker stats on the dev stack: traefik 44 MiB, web-nexo 8,
#   gateway 10, agent 1060 idle / 1250 peak (2026-10-06), redis 18,
#   postgres 35, n8n 257.

services:

  # ── Traefik ────────────────────────────────────────────────────────────────
  # Replaces the entire base command:
  #   - No --api.insecure: dashboard off (and port 8888 only exists in override.yml).
  #   - HTTPS entrypoint + Let's Encrypt (HTTP-01) for ${DOMAIN} and www.${DOMAIN}.
  #   - Every HTTP request is redirected to HTTPS, permanently.
  #   - No access log (Traefik's default; never add --accesslog: RequestPath
  #     keeps the query string, e.g. /ws?ticket=).
  #   - ACME storage in a named volume: a bind mount of a missing acme.json makes
  #     Docker create a directory there and ACME fails.
  traefik:
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--ping=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL is required}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "443:443"
    volumes:
      - traefik_acme:/letsencrypt
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Frontend ───────────────────────────────────────────────────────────────
  # Routes on websecure (HTTPS) with TLS cert from letsencrypt resolver.
  # Host() rule prevents serving requests for unknown domains; backend paths
  # never fall through to nginx. This container also carries the shared
  # middlewares:
  #   - security-headers: HSTS (1 year, subdomains, no preload), nosniff,
  #     X-Frame-Options DENY, Referrer-Policy and Permissions-Policy; strips
  #     the Server header.
  #   - csp-report-only (frontend router only): the candidate policy of
  #     web-nexo/docs/csp.md as Content-Security-Policy-Report-Only. Browsers
  #     report violations in the console and block nothing. Traefik v2.11 has
  #     no report-only option (contentSecurityPolicy would enforce it), hence
  #     customResponseHeaders. No report-to: there is no receiver yet.
  #   - www-to-root: https://www.${DOMAIN}/… → https://${DOMAIN}/… (301).
  web-nexo:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web-nexo.rule=Host(`${DOMAIN:?DOMAIN is required}`) && PathPrefix(`/`) && !PathPrefix(`/ws`) && !PathPrefix(`/api`) && !PathPrefix(`/auth`) && !PathPrefix(`/health`)"
      - "traefik.http.routers.web-nexo.entrypoints=websecure"
      - "traefik.http.routers.web-nexo.tls=true"
      - "traefik.http.routers.web-nexo.tls.certresolver=letsencrypt"
      - "traefik.http.routers.web-nexo.middlewares=security-headers,csp-report-only"
      - "traefik.http.services.web-nexo.loadbalancer.server.port=80"
      - "traefik.http.routers.www.rule=Host(`www.${DOMAIN:?DOMAIN is required}`)"
      - "traefik.http.routers.www.entrypoints=websecure"
      - "traefik.http.routers.www.tls=true"
      - "traefik.http.routers.www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.www.middlewares=www-to-root,security-headers"
      - "traefik.http.middlewares.www-to-root.redirectregex.regex=^https://www\\.(.*)"
      - "traefik.http.middlewares.www-to-root.redirectregex.replacement=https://$${1}"
      - "traefik.http.middlewares.www-to-root.redirectregex.permanent=true"
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.security-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.security-headers.headers.permissionsPolicy=camera=(), microphone=(), geolocation=(), payment=()"
      - "traefik.http.middlewares.security-headers.headers.customResponseHeaders.Server="
      - "traefik.http.middlewares.csp-report-only.headers.customResponseHeaders.Content-Security-Policy-Report-Only=default-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' wss://${DOMAIN:?DOMAIN is required}; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; manifest-src 'self'"
    deploy:
      resources:
        limits:
          memory: 64M

  # ── Gateway ────────────────────────────────────────────────────────────────
  # Same host + path rules as dev, but on websecure with TLS.
  # /internal/* lives on the agent and has NO Traefik labels — never exposed.
  gateway:
    environment:
      - PASETO_LOCAL_KEY=${PASETO_LOCAL_KEY:?PASETO_LOCAL_KEY is required (make gen-key)}
      - POSTGRES_URL=postgresql://nexo:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexo
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required (https://DOMAIN)}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.rule=Host(`${DOMAIN:?DOMAIN is required}`) && (PathPrefix(`/health`) || PathPrefix(`/auth`) || PathPrefix(`/api`) || PathPrefix(`/ws`))"
      - "traefik.http.routers.gateway.entrypoints=websecure"
      - "traefik.http.routers.gateway.tls=true"
      - "traefik.http.routers.gateway.tls.certresolver=letsencrypt"
      - "traefik.http.routers.gateway.middlewares=security-headers@docker"
      - "traefik.http.services.gateway.loadbalancer.server.port=8080"
    deploy:
      resources:
        limits:
          memory: 64M

  # ── Agent ──────────────────────────────────────────────────────────────────
  # No Traefik labels — accessible only from the Docker-internal network.
  # Measured with docker stats (CPU PyTorch). 2026-10-06, after switching to
  # paraphrase-multilingual-MiniLM-L12-v2 (docs/eval/resultados.md):
  # 1.06 GiB idle and 1.22 GiB peak after 400 long RAG searches (16 parallel);
  # PyTorch keeps its buffers, so usage stays near the peak. (Before, with
  # all-MiniLM-L6-v2: 391 MiB idle, 809 MiB peak.) 2048 MB ≈ 1.6× the peak.
  agent:
    environment:
      - POSTGRES_URL=postgresql://nexo:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nexo
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:?TELEGRAM_CHAT_ID is required}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required (https://DOMAIN)}
    deploy:
      resources:
        limits:
          memory: 2048M

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    deploy:
      resources:
        limits:
          memory: 128M

  # ── Postgres ───────────────────────────────────────────────────────────────
  # 512 MB: pgvector similarity searches on real data can spike over the ~20 MB
  # measured in dev.
  postgres:
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    deploy:
      resources:
        limits:
          memory: 512M

  # ── n8n ────────────────────────────────────────────────────────────────────
  # UI (port 5678) is NOT published — only accessible via SSH tunnel:
  #   ssh -L 5678:localhost:5678 user@<vps-ip> -N
  # 512 MB: 255 MB measured in dev with active workflows; 2× headroom.
  n8n:
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
      - N8N_OWNER_PASSWORD=${N8N_OWNER_PASSWORD:?N8N_OWNER_PASSWORD is required}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:?TELEGRAM_CHAT_ID is required}
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  traefik_acme:
