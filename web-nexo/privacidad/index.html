<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b10">
  <meta name="description" content="Aviso de privacidad del portafolio Nexo de Kirbith Cubillas: datos, conservación y derechos.">
  <title>Aviso de privacidad · Nexo</title>

<body>
  <header><a id="privacy-home" href="/"></a><button id="privacy-language" type="button"></button></header>
  <main><article id="privacy-content"></article>
    <section class="privacy-actions"><button id="privacy-delete" type="button"></button><p id="privacy-status" role="status" aria-live="polite"></p></section>

  <dialog id="privacy-confirm" aria-labelledby="privacy-confirm-title" aria-describedby="privacy-confirm-detail">
    <h2 id="privacy-confirm-title"></h2><p id="privacy-confirm-detail"></p>
    <button id="privacy-cancel" type="button" autofocus></button><button id="privacy-confirm-delete" type="button"></button>
    <p id="privacy-confirm-status" role="status" aria-live="polite"></p>
  </dialog>
  <script type="module" src="/src/privacy/page.ts"></script>
