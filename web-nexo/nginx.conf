# Intentionally omit query strings and Referer (both may contain credentials).
log_format nexo_privacy '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log nexo_privacy;

    # Report-only candidate; NOT enabled. See docs/csp.md before uncommenting.
    # add_header Content-Security-Policy-Report-Only "default-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' wss://__PUBLIC_HOST__; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; manifest-src 'self'" always;

    location = /privacidad { try_files /privacidad/index.html =404; }
    location = /privacidad/ { try_files /privacidad/index.html =404; }

    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"web-nexo"}';
        add_header Content-Type application/json;
    }

    location ^~ /media/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
