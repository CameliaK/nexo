# Auto-loaded in development: adds debug ports and dev-only services that must
# not exist in prod.
# - Traefik dashboard at localhost:8888
# - n8n UI at localhost:5678
# - Mailpit (captures every email the gateway sends) UI at localhost:8025
# Production uses docker-compose.prod.yml instead of this file.
services:
  traefik:
    ports:
      - "8888:8080"

  n8n:
    ports:
      - "5678:5678"

  # SMTP 1025 stays inside the Docker network; only the UI/API is published.
  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Dev only: send through mailpit, which speaks plain SMTP. The base file
  # defaults to SMTP_TLS=starttls (mandatory TLS) for production.
  gateway:
    environment:
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_TLS=none
      - SMTP_USER=
      - SMTP_PASS=
      - MAIL_FROM=Nexo <no-reply@nexo.local>
    depends_on:
      mailpit:
        condition: service_started
