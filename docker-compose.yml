services:
  traefik:
    image: traefik:v2.11
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  web-nexo:
    build: ./web-nexo
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web-nexo.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web-nexo.entrypoints=web"
      - "traefik.http.services.web-nexo.loadbalancer.server.port=80"
    restart: unless-stopped
