services:
  traefik:
    image: traefik:v2.11
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  web-nexo:
    build: ./web-nexo
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web-nexo.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web-nexo.entrypoints=web"
      - "traefik.http.services.web-nexo.loadbalancer.server.port=80"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  gateway:
    build: ./gateway-go
    environment:
      - DOCKER_API_VERSION=1.44
      - REDIS_URL=redis://redis:6379
      - PASETO_LOCAL_KEY=${PASETO_LOCAL_KEY:-}
      - TOKEN_EXPIRY=24h
      - AGENT_URL=http://agent:8000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.rule=PathPrefix(`/health`) || PathPrefix(`/auth`) || PathPrefix(`/api`) || PathPrefix(`/ws`)"
      - "traefik.http.routers.gateway.entrypoints=web"
      - "traefik.http.services.gateway.loadbalancer.server.port=8080"
    depends_on:
      - redis
      - agent
    restart: unless-stopped

  agent:
    build: ./ai-python
    environment:
      - DOCKER_API_VERSION=1.44
      - REDIS_URL=redis://redis:6379
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - PORTFOLIO_PATH=/docs/portfolio-content.json
    volumes:
      - ./docs:/docs:ro
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
