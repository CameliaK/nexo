services:
  traefik:
    image: traefik:v2.11
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  web-nexo:
    build: ./web-nexo
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web-nexo.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web-nexo.entrypoints=web"
      - "traefik.http.services.web-nexo.loadbalancer.server.port=80"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      - POSTGRES_USER=nexo
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nexo}
      - POSTGRES_DB=nexo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo -d nexo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  gateway:
    build: ./gateway-go
    environment:
      - DOCKER_API_VERSION=1.44
      - REDIS_URL=redis://redis:6379
      - PASETO_LOCAL_KEY=${PASETO_LOCAL_KEY:-}
      - TOKEN_EXPIRY=24h
      - AGENT_URL=http://agent:8000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.rule=PathPrefix(`/health`) || PathPrefix(`/auth`) || PathPrefix(`/api`) || PathPrefix(`/ws`)"
      - "traefik.http.routers.gateway.entrypoints=web"
      - "traefik.http.services.gateway.loadbalancer.server.port=8080"
    depends_on:
      - redis
      - agent
    restart: unless-stopped

  agent:
    build: ./ai-python
    environment:
      - DOCKER_API_VERSION=1.44
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://nexo:${POSTGRES_PASSWORD:-nexo}@postgres:5432/nexo
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - PORTFOLIO_PATH=/docs/portfolio-content.json
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/nexo-deep-route
      - RAG_SIMILARITY_THRESHOLD=${RAG_SIMILARITY_THRESHOLD:-0.75}
      - ROUTE_CONFIDENCE_THRESHOLD=${ROUTE_CONFIDENCE_THRESHOLD:-0.7}
    volumes:
      - ./docs:/docs:ro
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:1
    environment:
      - DOCKER_API_VERSION=1.44
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-nexo-dev-change-in-prod}
      - N8N_LOG_LEVEL=info
      - WEBHOOK_URL=http://n8n:5678/
      - EXECUTIONS_PROCESS=main
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
    entrypoint: ["/bin/sh", "/scripts/entrypoint.sh"]
    volumes:
      - ./orchestrator-n8n:/scripts:ro
      - ./orchestrator-n8n/workflows:/workflows:ro
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"
    depends_on:
      agent:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  n8n_data:
