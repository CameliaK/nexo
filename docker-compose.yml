# Rotación de logs de Docker en todos los servicios: como máximo 3 archivos de
# 10 MB por contenedor (30 MB), en desarrollo y en producción.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  traefik:
    image: traefik:v2.11
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--entrypoints.web.address=:80"
      - "--ping=true"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *default-logging

  web-nexo:
    build: ./web-nexo
    labels:
      - "traefik.enable=true"
      # Las rutas del backend nunca caen en nginx, ni con el gateway caído o
      # recreándose: /ws?token=… acabaría en su registro de acceso.
      - "traefik.http.routers.web-nexo.rule=PathPrefix(`/`) && !PathPrefix(`/ws`) && !PathPrefix(`/api`) && !PathPrefix(`/auth`) && !PathPrefix(`/health`)"
      - "traefik.http.routers.web-nexo.entrypoints=web"
      - "traefik.http.services.web-nexo.loadbalancer.server.port=80"
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - redis_data:/data

  postgres:
    image: pgvector/pgvector:pg17
    # terse: los errores no llevan DETAIL, que repite valores (p. ej. el correo
    # en una violación de unicidad).
    command: ["postgres", "-c", "log_error_verbosity=terse"]
    environment:
      - POSTGRES_USER=nexo
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nexo}
      - POSTGRES_DB=nexo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo -d nexo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  gateway:
    build: ./gateway-go
    environment:
      - DOCKER_API_VERSION=1.44
      - REDIS_URL=redis://redis:6379
      - PASETO_LOCAL_KEY=${PASETO_LOCAL_KEY:-}
      - TOKEN_EXPIRY=24h
      - AGENT_URL=http://agent:8000
      - POSTGRES_URL=postgresql://nexo:${POSTGRES_PASSWORD:-nexo}@postgres:5432/nexo
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost}
      # Cuentas
      - USER_TOKEN_TTL=168h
      - OWNER_TOKEN_TTL=8h
      - OWNER_EMAIL=${OWNER_EMAIL:-}
      - OWNER_PROVIDERS=google
      - AUTH_EMAIL_PER_HOUR=5
      - AUTH_EMAIL_PER_IP_HOUR=20
      - AUTH_GUEST_PER_IP_HOUR=${AUTH_GUEST_PER_IP_HOUR:-60}
      # Límites del chat con el agente (contrato §12)
      - CHAT_RATE_PER_HOUR=${CHAT_RATE_PER_HOUR:-20}
      - CHAT_RATE_PER_IP_HOUR=${CHAT_RATE_PER_IP_HOUR:-60}
      - CHAT_ACTIVE_TTL=${CHAT_ACTIVE_TTL:-120s}
      # Solo se confía en X-Forwarded-For si la petición viene de estos (nombres o CIDR)
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-traefik}
      # Ajedrez oculto: jugadas del jugador por cuenta y hora; enfriamiento del
      # correo de aviso por partida
      - CHESS_MOVES_PER_HOUR=${CHESS_MOVES_PER_HOUR:-30}
      - CHESS_EMAIL_COOLDOWN_HOURS=${CHESS_EMAIL_COOLDOWN_HOURS:-6}
      # DELETE /api/v1/session/data: borrados por visitante y por IP, por hora
      - SESSION_DATA_DELETE_PER_HOUR=${SESSION_DATA_DELETE_PER_HOUR:-5}
      - SESSION_DATA_DELETE_PER_IP_HOUR=${SESSION_DATA_DELETE_PER_IP_HOUR:-20}
      # Correo. SMTP_TLS falla cerrado: starttls (obligatorio) o ssl.
      # Solo docker-compose.override.yml (dev, mailpit) lo pone en none.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_TLS=${SMTP_TLS:-starttls}
      - MAIL_FROM=${MAIL_FROM:-}
      # Google (OIDC)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URL=${GOOGLE_REDIRECT_URL:-}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.rule=PathPrefix(`/health`) || PathPrefix(`/auth`) || PathPrefix(`/api`) || PathPrefix(`/ws`)"
      - "traefik.http.routers.gateway.entrypoints=web"
      - "traefik.http.services.gateway.loadbalancer.server.port=8080"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      agent:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging

  agent:
    build: ./ai-python
    environment:
      - DOCKER_API_VERSION=1.44
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://nexo:${POSTGRES_PASSWORD:-nexo}@postgres:5432/nexo
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - PORTFOLIO_PATH=/docs/portfolio-content.json
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/nexo-deep-route
      - N8N_LIVE_OUTBOUND_URL=http://n8n:5678/webhook/nexo-live-outbound
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      # Calibrado el 2026-10-06 con docs/eval (multilingüe + contenido): 0.35
      - RAG_SIMILARITY_THRESHOLD=${RAG_SIMILARITY_THRESHOLD:-0.35}
      - ROUTE_CONFIDENCE_THRESHOLD=${ROUTE_CONFIDENCE_THRESHOLD:-0.7}
      # Tope diario global de llamadas al LLM (se reinicia a las 00:00 UTC)
      - LLM_DAILY_CALLS=${LLM_DAILY_CALLS:-1500}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost}
      # Ajedrez oculto: partidas activas en total; caducidad (días sin actividad
      # y horas sin ninguna jugada); un aviso de Telegram por partida cada N min
      - CHESS_MAX_ACTIVE=${CHESS_MAX_ACTIVE:-5}
      - CHESS_EXPIRE_DAYS=${CHESS_EXPIRE_DAYS:-30}
      - CHESS_EMPTY_EXPIRE_HOURS=${CHESS_EMPTY_EXPIRE_HOURS:-48}
      - CHESS_NOTIFY_MINUTES=${CHESS_NOTIFY_MINUTES:-10}
      # Retención: nodos generados sin actividad y mensajes del chat en vivo
      - NODES_RETENTION_DAYS=${NODES_RETENTION_DAYS:-90}
      - LIVE_RETENTION_DAYS=${LIVE_RETENTION_DAYS:-180}
    volumes:
      - ./docs:/docs:ro
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    logging: *default-logging

  n8n:
    # Versión fijada: los flujos y activate-via-api.js están verificados con
    # 1.123.x (Code nodes en vm2, ver CLAUDE.md). Subirla es un cambio a probar.
    image: docker.n8n.io/n8nio/n8n:1.123.27
    environment:
      - DOCKER_API_VERSION=1.44
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-nexo-dev-change-in-prod}
      - N8N_LOG_LEVEL=info
      - WEBHOOK_URL=http://n8n:5678/
      - EXECUTIONS_PROCESS=main
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # Las ejecuciones guardan el cuerpo de los webhooks (texto del chat en
      # vivo, token del bot): no se guardan las correctas y los errores se
      # purgan a los 7 días.
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - N8N_OWNER_PASSWORD=${N8N_OWNER_PASSWORD:-N3x0Dev2026!}
    entrypoint: ["/bin/sh", "/scripts/entrypoint.sh"]
    volumes:
      - ./orchestrator-n8n:/scripts:ro
      - ./orchestrator-n8n/workflows:/workflows:ro
      - n8n_data:/home/node/.n8n
    depends_on:
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    logging: *default-logging

volumes:
  redis_data:
  postgres_data:
  n8n_data:
